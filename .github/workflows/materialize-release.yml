name: Materialize Rhetorical InDEX release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/materialize-release.yml"
      - "payload/**"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check payload
        id: payload
        shell: bash
        run: |
          if [ -f payload/part00.b64 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruct release
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat payload/part*.b64 > /tmp/rhetorical-index.b64
          test "$(wc -c < /tmp/rhetorical-index.b64)" -eq 131228
          base64 --decode /tmp/rhetorical-index.b64 > /tmp/rhetorical-index.tar.gz
          mkdir -p /tmp/rhetorical-index-release
          tar -xzf /tmp/rhetorical-index.tar.gz -C /tmp/rhetorical-index-release
          cp -a /tmp/rhetorical-index-release/. .
          rm -rf payload

      - name: Commit release tree
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Import Rhetorical InDEX release"
          git push
